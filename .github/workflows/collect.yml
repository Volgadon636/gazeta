name: collect

on:
  schedule:
    - cron: "7 4 * * *"   # 07:07 МСК — с запасом до утренней газеты
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4==4.12.3
      - run: python collect.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts latest.md
          git diff --cached --quiet || git commit -m "posts $(date -u -d 'yesterday' +%F)"
          git push
